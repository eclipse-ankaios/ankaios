template: |
  ## What's Changed

  $CHANGES

change-template: '- $TITLE (#$NUMBER)'
category-template: '### $TITLE'

categories:
  - title: 🛠️ Breaking Changes
    label: breaking-change
  - title: ✨ Features
    label: enhancement
  - title: 🐛 Bug Fixes
    label: bug
  - title: 📚 Documentation
    label: documentation
  - title: Other Changes
    label: chore

# Version resolution
version-resolver:
  major:
    labels:
      - 'major'
      - 'breaking-change'
  minor:
    labels:
      - 'minor'
      - 'enhancement'
  patch:
    labels:
      - 'patch'
      - 'bug'
      - 'fix'
  default: patch

name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'

exclude-labels:
  - 'ignore-for-release'

# Each target maintains its own stable draft.
filter-by-commitish: true
tag-prefix: 'v'
