name: Release Drafter

on:
  push:
    branches:
      - main
      - release-**
  create:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      from:
        description: 'Optional comparison baseline override (for example, v1.0.4)'
        required: false
        type: string
      version:
        description: 'Optional main preview version override; release branches use their fixed release line'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-drafter-${{ github.event_name == 'release' && 'main' || github.event_name == 'create' && github.event.ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  update_release_draft:
    if: >-
      github.event_name != 'create' ||
      (github.event.ref_type == 'branch' && startsWith(github.event.ref, 'release-'))
    permissions:
      # write permission is required to create a github release
      contents: write
      # write permission is required for autolabeler
      # otherwise, read permission is required at least
      pull-requests: write
    runs-on: ubuntu-latest
    env:
      TARGET_BRANCH: ${{ github.event_name == 'release' && 'main' || github.event_name == 'create' && github.event.ref || github.ref_name }}
    steps:
      - name: Select this branch's baseline and version
        id: select
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          INPUT_FROM: ${{ inputs.from }}
          INPUT_VERSION: ${{ inputs.version }}
        with:
          script: |
            const branch = process.env.TARGET_BRANCH;
            const line = /^release-(0|[1-9]\d*)\.(0|[1-9]\d*)$/.exec(branch);
            if (branch !== 'main' && !line) throw new Error(`Unsupported release target: ${branch}`);
            const parseVersion = (tag) => {
              const parsed = /^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.exec(tag);
              if (!parsed) return undefined;
              const parts = parsed.slice(1).map(Number);
              if (!parts.every(Number.isSafeInteger)) {
                throw new Error(`Release version exceeds safe integer limits: ${tag}`);
              }
              return parts;
            };
            const compare = (left, right) =>
              left[0] - right[0] || left[1] - right[1] || left[2] - right[2];
            const releases = await github.paginate(github.rest.repos.listReleases, {
              ...context.repo, per_page: 100,
            });
            const drafts = releases.filter((release) =>
              release.draft && !release.prerelease &&
              release.target_commitish.replace(/^refs\/heads\//, '') === branch);
            if (drafts.length > 1) {
              throw new Error(`Multiple stable drafts target ${branch}; keep one for this branch.`);
            }
            if (drafts[0] && !parseVersion(drafts[0].tag_name)) {
              throw new Error(`The existing stable draft has an unsupported tag: ${drafts[0].tag_name}`);
            }
            const stable = releases.filter((release) =>
              !release.draft && !release.prerelease && parseVersion(release.tag_name))
              .sort((left, right) => compare(parseVersion(right.tag_name), parseVersion(left.tag_name)));
            let previous = stable[0];
            let version = process.env.INPUT_VERSION.trim();
            if (line) {
              const initial = [Number(line[1]), Number(line[2]), 0];
              if (!initial.every(Number.isSafeInteger)) throw new Error(`Invalid release line: ${branch}`);
              const inLine = (release) => {
                const parts = parseVersion(release.tag_name);
                return parts[0] === initial[0] && parts[1] === initial[1];
              };
              const published = stable.find(inLine);
              previous = published || stable.find((release) =>
                compare(parseVersion(release.tag_name), initial) < 0);
              const next = published
                ? [...initial.slice(0, 2), parseVersion(published.tag_name)[2] + 1]
                : initial;
              if (!next.every(Number.isSafeInteger)) throw new Error(`Invalid next version on ${branch}`);
              const expected = next.join('.');
              if (version && version.replace(/^v/, '') !== expected) {
                throw new Error(`${branch} must draft ${expected}; version overrides are only supported on main.`);
              }
              version = expected;
            } else if (version) {
              const resolved = parseVersion(`v${version.replace(/^v/, '')}`);
              if (!resolved || (previous && compare(resolved, parseVersion(previous.tag_name)) <= 0)) {
                throw new Error('The main version override must be a stable version newer than the latest release.');
              }
            }
            const from = process.env.INPUT_FROM.trim() || previous?.tag_name;
            if (!from) throw new Error(`No published stable baseline exists for ${branch}; specify from manually.`);
            const { data } = await github.rest.repos.compareCommitsWithBasehead({
              ...context.repo, basehead: `${from}...${branch}`, per_page: 1,
            });
            core.setOutput('skip', data.total_commits === 0 ? 'true' : 'false');
            core.setOutput('from', from);
            core.setOutput('version', version);
            core.info(`Preparing ${branch} against ${from}; version ${version || 'determined by PR labels'}.`);
      - name: Calculate the main preview version from pull request labels
        id: preview
        if: steps.select.outputs.skip != 'true' && env.TARGET_BRANCH == 'main'
        uses: release-drafter/release-drafter@978bb0b30c5ee8cdd332ced253758157150d43f0 # v7.10.0
        with:
          config-name: release-drafter-preview.yml
          commitish: main
          from: ${{ steps.select.outputs.from }}
          version: ${{ steps.select.outputs.version }}
          dry-run: true
          publish: false
      - name: Update release draft
        if: steps.select.outputs.skip != 'true'
        uses: release-drafter/release-drafter@978bb0b30c5ee8cdd332ced253758157150d43f0 # v7.10.0
        with:
          commitish: ${{ env.TARGET_BRANCH }}
          from: ${{ steps.select.outputs.from }}
          version: ${{ steps.select.outputs.version || steps.preview.outputs.resolved_version }}
          footer: |


            **Full Changelog**: https://github.com/$OWNER/$REPOSITORY/compare/${{ steps.select.outputs.from }}...v$RESOLVED_VERSION
          publish: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
